<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Crowd Detector</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:20px auto;padding:0 14px}
  input,select{width:100%;padding:10px;font-size:1rem;margin:6px 0 12px}
  button{padding:10px 16px;font-size:1rem}
  video{width:100%;border-radius:8px;background:#000;margin-top:12px}
  .n{font-size:2.5rem;font-weight:700}
  .dispatch{padding:8px 12px;border-radius:8px;border:1px solid #ccc}
  .dispatch.on{background:#fff4cc;border-color:#e8a800;font-weight:700}
</style>
</head>
<body>
<h1>Camera Crowd Detector</h1>
<p><a href="/">&larr; Lift Dashboard</a></p>
<label>Backend URL (isi site par: /api)</label>
<input id="api" value="/api">
<label>Ye camera kis floor par laga hai?</label>
<select id="floor">
  <option value="0">Floor 0</option><option value="1">Floor 1</option>
  <option value="2">Floor 2</option><option value="3">Floor 3</option>
  <option value="4">Floor 4</option><option value="5">Floor 5</option>
</select>
<button id="start">Start camera</button>
<p id="status">Ready.</p>
<div>People: <span class="n" id="n">0</span></div>
<p id="dispatch" class="dispatch">6 ya zyada log dikhe to Lift B aur Lift C is floor par apne aap bheji jaayengi.</p>
<video id="v" autoplay muted playsinline></video>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const status = document.getElementById("status");
document.getElementById("start").onclick = async () => {
  const api = document.getElementById("api").value.replace(/\/$/, "");
  const floor = parseInt(document.getElementById("floor").value);
  const v = document.getElementById("v");
  try {
    status.textContent = "Camera khul raha hai...";
    v.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    status.textContent = "Model load ho raha hai (thoda time lagega)...";
    const model = await cocoSsd.load();
    status.textContent = "Running. Har 2 sec me count bhej raha hai.";
    setInterval(async () => {
      const preds = await model.detect(v);
      const count = preds.filter(p => p.class === "person").length;
      document.getElementById("n").textContent = count;
      fetch(api + "/crowd", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ crowd_count: count, floor: floor })
      }).then(r => r.json()).then(d => {
        const el = document.getElementById("dispatch");
        if (d.dispatched && d.dispatched.length) {
          el.className = "dispatch on";
          el.textContent = "Bheed hai! Lift " + d.dispatched.join(" aur Lift ") + " floor " + floor + " par bheji gayi.";
        } else {
          el.className = "dispatch";
          el.textContent = d.crowded ? "Bheed hai, par Lift B/C maintenance me hain." : "Bheed nahi hai (6 se kam log).";
        }
      }).catch(e => status.textContent = "Backend error: " + e);
    }, 2000);
  } catch (e) {
    status.textContent = "Error: " + e;
  }
};
</script>
</body>
</html>
