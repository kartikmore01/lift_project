<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lift Dashboard</title>
<style>
  :root{
    --bg:#e8eae6; --panel:#f6f7f4; --ink:#1b2a2e; --muted:#5d6b6e;
    --line:#c7ccc6; --car:#1f4fd8; --amber:#e8a800; --ok:#1c7c4d; --bad:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#151a1c; --panel:#1e2528; --ink:#e6ebe8; --muted:#8f9ca0; --line:#34403f; --car:#6d8cff; --amber:#f2b705; --ok:#4cc38a; --bad:#ff7b72; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:20px}
  main{max-width:760px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
  h1{font-size:1.5rem;margin:0}
  #conn{font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:8px}
  #dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  #dot.ok{background:var(--ok)} #dot.bad{background:var(--bad)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
  @media (max-width:560px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  .shaft{display:flex;flex-direction:column-reverse;height:360px;position:relative;border-left:3px solid var(--line);border-right:3px solid var(--line)}
  .floor{flex:1;border-top:1px dashed var(--line);display:flex;align-items:center;padding-left:10px;color:var(--muted);font-size:.9rem}
  .floor:last-child{border-top:none}
  #car{position:absolute;left:60px;right:14px;height:calc(100% / 6 - 8px);margin:4px 0;background:var(--car);border-radius:6px;bottom:0;transition:bottom .9s ease;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.3rem}
  .big{font-size:3.6rem;font-weight:800;line-height:1}
  .label{color:var(--muted);margin-bottom:6px}
  .stack > * + *{margin-top:22px}
  #crowdbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
  #crowdfill{height:100%;width:0;background:var(--amber);transition:width .5s}
  .stamp{font-size:.8rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Lift Dashboard</h1>
    <div id="conn"><span id="dot"></span><span id="connText">connecting...</span></div>
  </header>

  <div class="grid">
    <section class="panel">
      <div class="shaft" id="shaft"><div id="car">0</div></div>
    </section>

    <section class="panel stack">
      <div>
        <div class="label">Current floor</div>
        <div class="big" id="floor">-</div>
      </div>
      <div>
        <div class="label">Direction</div>
        <div class="big" style="font-size:2.2rem" id="direction">-</div>
      </div>
      <div>
        <div class="label">People waiting</div>
        <div class="big" id="crowd">-</div>
        <div id="crowdbar"><div id="crowdfill"></div></div>
      </div>
      <div class="stamp" id="stamp"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script>
  const FLOORS = 6; // floor 0 se 5
  const shaft = document.getElementById("shaft");
  const car = document.getElementById("car");
  for (let i = FLOORS - 1; i >= 0; i--) {
    const d = document.createElement("div");
    d.className = "floor"; d.textContent = "Floor " + i;
    shaft.insertBefore(d, car);
  }
  const arrows = { up: "▲ Up", down: "▼ Down", idle: "Idle" };

  async function load() {
    try {
      const r = await fetch(window.API_URL + "/status");
      const d = await r.json();
      document.getElementById("floor").textContent = d.floor;
      document.getElementById("direction").textContent = arrows[d.direction] || d.direction;
      document.getElementById("crowd").textContent = d.crowd_count;
      document.getElementById("crowdfill").style.width = Math.min(100, d.crowd_count * 10) + "%";
      car.textContent = d.floor;
      car.style.bottom = (d.floor * 100 / FLOORS) + "%";
      if (d.updated) document.getElementById("stamp").textContent =
        "Last update: " + new Date(d.updated * 1000).toLocaleTimeString();
      document.getElementById("dot").className = "ok";
      document.getElementById("connText").textContent = "live";
    } catch (e) {
      document.getElementById("dot").className = "bad";
      document.getElementById("connText").textContent = "backend se connect nahi ho raha";
    }
  }
  load(); setInterval(load, 2000);
</script>
</body>
</html>
